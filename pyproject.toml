[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "grokipedia-mcp-server"
version = "0.1.0"
description = "Unofficial read-only MCP server for Grokipedia"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mark Fladd" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "grokipedia", "mcp-server"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Development Status :: 3 - Alpha",
]
# Keep in sync with requirements.txt (exact pins; mcp stays on 1.x - 2.x renamed FastMCP)
dependencies = [
  "mcp==1.30.0",
  "httpx==0.28.1",
  "beautifulsoup4==4.14.2",
  "lxml==6.1.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
grokipedia-mcp-server = "grokipedia_mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/voidwalkermark-pixel/grokipedia-mcp-server"
Issues = "https://github.com/voidwalkermark-pixel/grokipedia-mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["grokipedia_mcp_server"]

[tool.hatch.build.targets.sdist]
include = ["grokipedia_mcp_server", "tests", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "requirements.txt", "requirements.lock.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits grokipedia.com (deselect with -m 'not live')"]
addopts = "-m 'not live'"
